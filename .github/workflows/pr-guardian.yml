# Managed by the pr-guardian governor (github.com/ksprashu/pr-guardian). Edits are reverted.
name: pr-guardian
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  # Only /ai-review commands from writers act (scripts/route.py), and fork PRs are never
  # reviewed from a comment (the scan job refuses cross-repository heads).
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true
permissions: {}
jobs:
  guardian:
    # Ordinary PR comments never start a run, so they cannot cancel a review in flight.
    if: >-
      (github.event_name != 'issue_comment' && github.event_name != 'pull_request_review_comment')
      || startsWith(github.event.comment.body, '/ai-review')
    concurrency:
      group: >-
        pr-guardian-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}-${{
        (github.event.action == 'labeled' || startsWith(github.event.comment.body, '/ai-review escalate'))
        && 'verdict' || 'review' }}
      cancel-in-progress: true
    uses: ksprashu/pr-guardian/.github/workflows/review.yml@e4ab1858f0ca1d70567e790f22879199f2ecae22
    with:
      guardian_ref: e4ab1858f0ca1d70567e790f22879199f2ecae22
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
