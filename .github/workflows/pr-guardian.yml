# Managed by the pr-guardian governor (github.com/ksprashu/pr-guardian). Edits are reverted.
name: pr-guardian
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  # Only /ai-review commands from writers act (scripts/route.py), and fork PRs are never
  # reviewed from a comment (the scan job refuses cross-repository heads).
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true
permissions: {}
jobs:
  guardian:
    # Start a run only for events scripts/route.py can act on (GHSA-6wg7-gfpx-8639): review
    # actions, an edit that retargets the base (changes.base.ref.from set; the verdict is bound
    # to the reviewed base, GHSA-6h55-p37r-jc34; title/body edits never start a run), the
    # human-override label being applied or removed (removal recomputes the verdict, so an
    # override's success never outlives the label), the needs-human label being removed (the
    # verdict is recomputed; when the owner removed it, that round's escalation is acknowledged,
    # never one a workflow change raised), and non-bot /ai-review comments on PRs from writers
    # (OWNER, MEMBER, COLLABORATOR, as route.py's WRITE_ASSOCIATIONS).
    # Outsiders, bots, plain issues, other labels and title/body edits never join a
    # concurrency group, so they cannot cancel a run.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
      && (github.event.action == 'opened' || github.event.action == 'synchronize'
      || github.event.action == 'reopened' || github.event.action == 'ready_for_review'
      || (github.event.action == 'edited' && github.event.changes.base != null
      && github.event.changes.base.ref.from != '')
      || ((github.event.action == 'labeled' || github.event.action == 'unlabeled')
      && github.event.label.name == 'human-override')
      || (github.event.action == 'unlabeled' && github.event.label.name == 'needs-human')))
      || ((github.event_name == 'pull_request_review_comment'
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null))
      && github.event.comment.user.type != 'Bot'
      && (github.event.comment.body == '/ai-review'
      || startsWith(github.event.comment.body, '/ai-review '))
      && (github.event.comment.author_association == 'OWNER'
      || github.event.comment.author_association == 'MEMBER'
      || github.event.comment.author_association == 'COLLABORATOR'))
    # Only review triggers (PR pushes and the like, dispatch, the owner's bare /ai-review, and a
    # wontfix inside a finding thread) cancel superseded reviews. Verdict-only runs (labels, escalate,
    # help, explain, override, a top-level wontfix, unknown commands) queue instead, so an
    # informational command never cancels a review that route.py would not restart.
    # GitHub Actions == and startsWith are case-insensitive and do not trim; commands.py shares
    # this exact grammar (no leading/trailing space on bare /ai-review, one ASCII space before args).
    concurrency:
      group: >-
        pr-guardian-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}-${{
        (github.event.action == 'labeled' || github.event.action == 'unlabeled'
        || (github.event.comment.body != null
        && !(github.event.comment.body == '/ai-review' && github.event.comment.author_association == 'OWNER'
        && github.event.comment.user.login == github.repository_owner)
        && !(github.event_name == 'pull_request_review_comment'
        && startsWith(github.event.comment.body, '/ai-review wontfix'))))
        && 'verdict' || 'review' }}
      cancel-in-progress: >-
        ${{ !(github.event.action == 'labeled' || github.event.action == 'unlabeled'
        || (github.event.comment.body != null
        && !(github.event.comment.body == '/ai-review' && github.event.comment.author_association == 'OWNER'
        && github.event.comment.user.login == github.repository_owner)
        && !(github.event_name == 'pull_request_review_comment'
        && startsWith(github.event.comment.body, '/ai-review wontfix')))) }}
    uses: ksprashu/pr-guardian/.github/workflows/review.yml@298b06b06266f508b18e4a7d43c590766376b8f2
    with:
      guardian_ref: 298b06b06266f508b18e4a7d43c590766376b8f2
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
